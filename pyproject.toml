[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ObsTurbMeasurement"
version = "0.1.0"
description = "Tools for measuring turbulence properties from astronomical observations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "spectral-cube",
    "spectral-cube-plus",
    "matplotlib",
    "cfpack"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ObsTurbMeasurement*"]
